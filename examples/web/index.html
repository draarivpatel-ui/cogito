<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>cogito demo</title>
<style>
 :root{color-scheme:light dark;--bg:#faf8f3;--fg:#111;--mut:#777;--line:#ddd}
 @media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--mut:#999;--line:#333}}
 body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
 main{max-width:640px;margin:0 auto;padding:32px 16px}
 h1{font-size:20px;margin:0 0 4px} p.sub{color:var(--mut);margin:0 0 24px}
 form{display:flex;gap:8px;flex-wrap:wrap} input{flex:1;min-width:160px;padding:10px;border:1px solid var(--line);background:transparent;color:inherit}
 select,button{padding:10px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);cursor:pointer} select{background:transparent;color:inherit;border-color:var(--line)}
 #status{margin:24px 0 8px;min-height:1.5em;color:var(--mut)} #status.on::after{content:"...";animation:d 1s steps(4) infinite}
 @keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
 #steps{list-style:none;padding:0;margin:0 0 12px;font-size:14px;color:var(--mut)} #answer{white-space:pre-wrap;border-top:1px solid var(--line);padding-top:12px;min-height:3em}
 #meta{font-size:12px;color:var(--mut);margin-top:16px}
</style>
<main>
 <h1>cogito demo</h1><p class="sub">A fake model streaming over plain fetch. No SDK.</p>
 <form id="f"><input id="q" value="what is cogito?" aria-label="prompt">
  <select id="lvl" aria-label="level"><option value="0">level 0: state</option><option value="1" selected>level 1: steps</option><option value="2">level 2: reasoning</option></select>
  <select id="start" aria-label="start profile"><option>bin</option><option selected>ndjson</option><option>sse</option></select><button>Send</button></form>
 <div id="status" aria-live="polite"></div><ul id="steps"></ul><div id="answer"></div><div id="meta"></div>
</main>
<script type="module">
import { cogito } from "/cogito.mjs";
const $ = (id) => document.getElementById(id);
$("f").onsubmit = async (e) => {
  e.preventDefault();
  $("status").textContent = ""; $("steps").innerHTML = ""; $("answer").textContent = ""; $("meta").textContent = "";
  const steps = {}; let reasoning = "", n = 0, t0 = performance.now(), first = null;
  try {
    for await (const f of cogito("/v1/cogito", { prompt: $("q").value }, { level: +$("lvl").value, start: $("start").value })) {
      n++; first ??= performance.now() - t0;
      if (f.h) $("meta").textContent = `run ${f.h.id}, level ${f.h.lvl}, retention ${f.h.ret}, format ${f.h.fmt}`;
      if (f.s) { $("status").textContent = f.s; $("status").classList.add("on"); }
      if (f.p) { let li = steps[f.p] ??= $("steps").appendChild(document.createElement("li")); li.textContent = `${f.st === "ok" ? "done" : f.st === "err" ? "failed" : "running"}: ${f.l ?? f.p}`; }
      if (f.r) { reasoning += f.r; $("status").title = reasoning; }
      if (f.t) $("answer").textContent += f.t;
      if (f.e) $("answer").textContent = "error: " + f.e.m;
      if (f.d) { $("status").textContent = ""; $("status").classList.remove("on"); $("meta").textContent += `, ${n} frames, first frame ${first.toFixed(0)} ms, total ${(performance.now() - t0).toFixed(0)} ms`; }
    }
  } catch (err) { $("status").classList.remove("on"); $("status").textContent = "failed: " + err.message; }
};
</script></html>
